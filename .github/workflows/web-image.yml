name: Publish Web Image

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/web-image.yml"
      - "apps/web/**"
      - "packages/shared/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "turbo.json"
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/synology-monitor-web

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prove the live-version check (matching passes, deliberately stale fails)
        run: bash apps/web/scripts/test-verify-live-version.sh

      # PLAN.md §9.7 — hard build blockers. If these fail the image is never
      # built/pushed and Coolify is never triggered, so a cache-hostile prompt
      # ordering, collapsed multi-turn history, or an un-normalized provider
      # usage field cannot reach production.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm@9

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: AI cache CI guards
        run: pnpm --filter @synology-monitor/web run guard:ai

      - name: Search indexing watchdog checks
        run: |
          node --test apps/web/scripts/search-embedding-watchdog.test.mjs apps/web/scripts/search-watchdog-entrypoint.test.mjs
          pnpm --filter @synology-monitor/web exec tsx --test src/lib/active-alerts.test.ts

      # This workflow triggers on packages/shared/**, and stage2-reasoning.ts builds
      # its tool list straight from ALL_TOOL_DEFS (filtering !def.write) and executes
      # the shell those tools generate. So web ships the same tier-1 read tools the
      # NAS MCP does — the ones that auto-execute with no approval — and until this
      # step existed it shipped them without ever running the catalog's safety suite.
      # nas-mcp-image.yml has had this gate since the 2026-07-16 rename fix; the
      # registry-wide audit is what showed web needed the identical one.
      - name: Test shared tool catalog
        run: pnpm --filter @synology-monitor/shared run test

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha
            type=raw,value=sha-${{ github.sha }}
            type=ref,event=branch

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            BUILD_SHA=${{ github.sha }}

      - name: Pin Coolify to the immutable image tag
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          # Application uuid (not a secret) for nas-monitor-web / mon.designflow.app.
          COOLIFY_APP_UUID: lrddgp8im0276gllujfu7wm3
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          echo "Pinning Coolify to ghcr.io/u2giants/synology-monitor-web:${IMAGE_TAG}..."
          response=$(curl -sS -w "\n%{http_code}" \
            -X PATCH \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            "https://coolify.designflow.app/api/v1/applications/${COOLIFY_APP_UUID}" \
            -d "{\"docker_registry_image_tag\": \"${IMAGE_TAG}\"}")

          http_code=$(echo "$response" | tail -1)
          echo "Response code: ${http_code}"

          if [ "$http_code" != "200" ]; then
            echo "Coolify tag pin failed with HTTP ${http_code}"
            echo "Deploy stays fail-closed: refusing to deploy a mutable tag."
            exit 1
          fi

      - name: Trigger Coolify redeploy
        run: |
          # POST, not GET: Coolify's deploy endpoint moved to POST and answers a
          # GET with {"message":"This endpoint has changed to a POST request."}.
          # --fail-with-body is what makes that visible — the previous `curl -s`
          # exited 0 on that refusal, so the workflow reported success while
          # nothing deployed. nas-mcp silently stopped deploying for weeks.
          curl -sS --fail-with-body -X POST \
            "http://178.156.180.212:8000/api/v1/deploy?uuid=${{ secrets.COOLIFY_WEBHOOK_UUID }}&force=false" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"

      - name: Verify production serves this commit
        run: |
          bash apps/web/scripts/verify-live-version.sh \
            --url "https://mon.designflow.app/version.json" \
            --expected "${GITHUB_SHA}" \
            --attempts 60 --interval 10
