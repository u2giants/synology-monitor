# Legacy local compose kept for development only.
# For Synology deployment, use deploy/synology/docker-compose.nas-{1,2}.yml
# with a published image instead of building on the NAS.

services:
  synology-monitor-agent:
    image: ghcr.io/u2giants/synology-monitor-agent:latest
    container_name: synology-monitor-agent
    network_mode: host
    restart: unless-stopped
    volumes:
      - /var/log:/host/log:ro
      - /volume1:/host/volume1:ro
      - agent-data:/app/data
    env_file:
      - .env
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  agent-data:
